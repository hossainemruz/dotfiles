"flatpak:com.github.wwmm.easyeffects" = { version = "latest", os = "linux" }
"flatpak:com.rustdesk.RustDesk" = { version = "latest", os = "linux" }
"flatpak:de.haeckerfelix.Fragments" = { version = "latest", os = "linux" }
