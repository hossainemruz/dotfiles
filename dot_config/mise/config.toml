"flatpak:io.github.linx_systems.ClamUI" = { version = "latest", os = "linux" }
"flatpak:io.github.wiiznokes.fan-control" = { version = "latest", os = "linux" }
"flatpak:io.missioncenter.MissionCenter" = { version = "latest", os = "linux" }
